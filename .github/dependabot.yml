version: 2

updates:
  # Patch-level Cargo updates only. The first grouped PR proved why: one batch
  # carried rand 0.9, base32 0.5, ureq 3 and sha1 0.11+, all of which rename or
  # remove APIs this code uses. Minor bumps here are a migration, not a merge.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      rust-patches:
        patterns:
          - "*"
        update-types:
          - patch
    # `update-types` on a group only controls what gets grouped — it does not
    # stop Dependabot opening the rest individually. This does.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    groups:
      actions:
        patterns:
          - "*"
