name: smoke

# Exercise the archives a user actually downloads, on the three platforms the
# release builds for. The checks are deliberately the user-facing ones: verify
# the hash, run `--version`, start the UI, read `/api/state`, fetch the page.

on:
  # Releases published by a workflow with GITHUB_TOKEN do not cascade into other
  # workflows (GitHub suppresses the chain on purpose), so this hangs off the
  # release workflow finishing instead — the same moment, one hop away.
  workflow_run:
    workflows: [release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to exercise (defaults to the latest release)
        required: false

permissions:
  contents: read

jobs:
  published-archive:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            asset: ftc-linux-x86_64.tar.gz
          - os: macos-latest
            name: macos-arm64
            asset: ftc-macos-arm64.tar.gz
          - os: windows-latest
            name: windows-x86_64
            asset: ftc-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Pick the release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${EVENT_TAG:-$RUN_TAG}}"
          if [ -z "$tag" ]; then
            tag="$(curl -fsSL https://api.github.com/repos/cyberd4ch/footorrent/releases/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exercising $tag on ${{ matrix.name }}"

      - name: Download, verify and unpack
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          base="https://github.com/cyberd4ch/footorrent/releases/download/$TAG"
          mkdir -p pkg
          curl -fsSL -o "pkg/$ASSET" "$base/$ASSET"
          curl -fsSL -o pkg/SHA256SUMS "$base/SHA256SUMS"
          cd pkg
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS --ignore-missing
          else
            shasum -a 256 -c SHA256SUMS --ignore-missing
          fi
          case "$ASSET" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "$ASSET"
              else
                powershell -NoProfile -Command "Expand-Archive -Path '$ASSET' -DestinationPath . -Force"
              fi
              ;;
            *)
              tar xzf "$ASSET"
              ;;
          esac
          ls -l

      - name: The footorrent alias works
        if: runner.os != 'Windows'
        shell: bash
        run: ./pkg/footorrent --version

      - name: The footorrent alias works (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: pkg\footorrent.cmd --version

      - name: Run the binary and serve the page
        shell: bash
        run: |
          set -euo pipefail
          binary=./pkg/ftc
          if [ -f ./pkg/ftc.exe ]; then binary=./pkg/ftc.exe; fi
          "$binary" --version
          mkdir -p downloads
          "$binary" serve --port 0 --bind 127.0.0.1 -o downloads > serve.log 2>&1 &
          server=$!
          url=""
          for _ in $(seq 1 40); do
            url="$(grep -Eo 'http://[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]+' serve.log | head -1 || true)"
            [ -n "$url" ] && break
            sleep 0.5
          done
          if [ -z "$url" ]; then
            echo "the server never printed a URL"; cat serve.log; exit 1
          fi
          echo "serving at $url"

          curl -fsS "$url/api/state" -o state.json
          python3 - <<'PY'
          import json
          state = json.load(open("state.json"))
          assert state["jobs"] == [], state
          assert state["version"], state
          print("state ok, version", state["version"], "| settings", state["settings"])
          PY

          curl -fsS "$url/" -o page.html
          grep -q "Download Manager" page.html
          grep -q "/api/state" page.html
          grep -q 'id="filters"' page.html
          curl -fsS "$url/favicon.ico" -o icon.svg
          grep -q "<svg" icon.svg
          echo "page and api served ok"

          curl -fsS -X POST -d 'target=/nope/missing.torrent&output=downloads' "$url/api/add" >/dev/null
          sleep 1
          curl -fsS "$url/api/state" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert d['jobs'] and d['jobs'][0]['status']=='error', d; print('error path ok:', d['jobs'][0]['error'][:60])"

          # A .torrent dropped on the page, in the exact shape the browser sends:
          # base64 in the form body. An archive from before 3.4.0 answers 404 here,
          # so this is what stops a stale build from looking green.
          grep -q 'id="dropzone"' page.html
          grep -q '/api/add-torrent' page.html
          curl -fsS -X POST --data-urlencode 'name=notes.torrent' --data-urlencode 'data=aGVsbG8=' \
            "$url/api/add-torrent" -o drop.json
          sleep 1
          curl -fsS "$url/api/state" -o after-drop.json
          python3 - <<'PY'
          import json
          drop = json.load(open("drop.json"))
          state = json.load(open("after-drop.json"))
          job = next((j for j in state["jobs"] if j["id"] == drop["id"]), None)
          assert job, (drop, state)
          assert job["status"] == "error", job
          print("drop path ok: job", job["id"], "->", job["error"][:50])
          PY

          if [ "${binary##*.}" = "exe" ]; then
            taskkill //F //PID "$server" >/dev/null 2>&1 || true
          else
            kill "$server" 2>/dev/null || true
          fi
          echo "${{ matrix.name }}: all checks passed"
