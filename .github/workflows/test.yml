name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a toolchain or registry change cannot rot the suite silently.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    # The engine is std-only and socket-heavy; run it where people run it, not
    # just on the box CI happens to prefer.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  scripts:
    # The installers are the first code a user runs; they get their own gate.
    name: script-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pwsh: false
          - os: windows-latest
            pwsh: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (install.sh)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          shellcheck --version
          shellcheck install.sh
      - name: PSScriptAnalyzer (install.ps1)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module PSScriptAnalyzer
          $violations = Invoke-ScriptAnalyzer -Path ./install.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error, Warning
          if ($violations) {
            $violations | ForEach-Object { "{0}:{1} [{2}] {3}" -f $_.ScriptName, $_.Line, $_.RuleName, $_.Message }
            exit 1
          }
          "install.ps1 clean"
