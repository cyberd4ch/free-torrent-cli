name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts: the test suite never launches Electron, and its
        # postinstall (install.js) requires ESM-only @electron/get, which
        # fails on Node < 22
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
