name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p free-torrent-cli
      # Archives, never a bare binary: a raw download loses the executable bit, so
      # macOS and Linux hand the user a file that double-clicks into a text editor.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ftc.exe" stage/ftc.exe
            # Brand alias without a second copy of the executable.
            # printf halves %% — the file must contain a single %~dp0, or cmd
            # treats the literal quotes as part of a command name.
            printf '@echo off\r\n"%%~dp0ftc.exe" %%*\r\n' > stage/footorrent.cmd
            cmd //c "stage\\footorrent.cmd --version"
            powershell -NoProfile -Command \
              "Compress-Archive -Path stage/ftc.exe,stage/footorrent.cmd -DestinationPath dist/ftc-${{ matrix.name }}.zip -Force"
          else
            cp "target/${{ matrix.target }}/release/ftc" stage/ftc
            chmod 755 stage/ftc
            ln -s ftc stage/footorrent
            tar -czf "dist/ftc-${{ matrix.name }}.tar.gz" -C stage ftc footorrent
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ftc-${{ matrix.name }}
          path: dist/*

  # The macOS app: the same Rust binary plus a small Swift window (gui/macos),
  # bundled so double-clicking gives an application window, not a browser tab.
  app-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine for both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin -p free-torrent-cli
          cargo build --release --target x86_64-apple-darwin -p free-torrent-cli
      # One universal bundle, not one per architecture: an arm64-only app on an
      # Intel Mac cannot launch, and install.sh would have to guess which zip a
      # machine can run.
      - name: Compile the window
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="stage/Footorrent.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/ftc" \
            target/aarch64-apple-darwin/release/ftc \
            target/x86_64-apple-darwin/release/ftc
          chmod 755 "$app/Contents/MacOS/ftc"
          # Built from assets/brand/icon-1024.svg; without it the dock shows a
          # generic app icon.
          cp assets/brand/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          swiftc -O gui/macos/main.swift -target arm64-apple-macos11 \
            -o "stage/ftc-gui-arm64" -framework AppKit -framework WebKit
          swiftc -O gui/macos/main.swift -target x86_64-apple-macos11 \
            -o "stage/ftc-gui-x86_64" -framework AppKit -framework WebKit
          lipo -create -output "$app/Contents/MacOS/ftc-gui" \
            "stage/ftc-gui-arm64" "stage/ftc-gui-x86_64"
          rm -f "stage/ftc-gui-arm64" "stage/ftc-gui-x86_64"
          # Fail the build here rather than ship a bundle that only half works.
          # One file per call: `lipo -archs` rejects a second input.
          lipo -archs "$app/Contents/MacOS/ftc"
          lipo -archs "$app/Contents/MacOS/ftc-gui"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Footorrent</string>
              <key>CFBundleDisplayName</key><string>Footorrent</string>
              <key>CFBundleIdentifier</key><string>dev.footorrent.webui</string>
              <key>CFBundleExecutable</key><string>ftc-gui</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>$version</string>
              <key>CFBundleVersion</key><string>$version</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
      # A Developer ID turns "right-click, Open anyway" into a normal double-click.
      # The secrets are optional on purpose: a fork or a maintainer without the
      # certificate still gets a working (ad-hoc signed) app, and the job says so
      # in its log instead of failing.
      - name: Sign, notarize and staple
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          app="stage/Footorrent.app"
          mkdir -p dist

          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "::notice title=Ad-hoc signature::No Developer ID secrets are configured, so the app is ad-hoc signed and macOS will warn on a browser download."
            codesign --force --deep --sign - "$app"
            codesign --verify --strict --verbose=2 "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" dist/ftc-macos-app.zip
            ls -l dist
            exit 0
          fi

          keychain="$RUNNER_TEMP/ftc-signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          trap 'security delete-keychain "$keychain" || true' EXIT

          identity="$MACOS_SIGN_IDENTITY"
          # The nested engine is signed first: `--deep` would leave it with the
          # ad-hoc signature it was built with, and the notary service rejects
          # a bundle with an unsigned-in-practice child.
          codesign --force --options runtime --timestamp --sign "$identity" \
            "$app/Contents/MacOS/ftc"
          codesign --force --options runtime --timestamp \
            --entitlements gui/macos/Footorrent.entitlements --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags' || true

          # Submit a zip, staple the bundle, then build the *shipped* zip from the
          # stapled bundle — otherwise the download carries no ticket and needs
          # the network on first launch.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/submit.zip"
          xcrun notarytool submit "$RUNNER_TEMP/submit.zip" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

          ditto -c -k --sequesterRsrc --keepParent "$app" dist/ftc-macos-app.zip
          # The zip is what people download, so check the ticket survived it.
          ditto -x -k dist/ftc-macos-app.zip "$RUNNER_TEMP/unzipped"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/unzipped/Footorrent.app"
          xcrun stapler validate "$RUNNER_TEMP/unzipped/Footorrent.app"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ftc-macos-app
          path: dist/*

  release:
    needs: [build, app-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ftc-*.tar.gz ftc-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ftc-*.tar.gz
            dist/ftc-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
