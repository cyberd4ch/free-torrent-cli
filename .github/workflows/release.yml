name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p free-torrent-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release/ftc
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          cp "$bin" "dist/ftc-${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ftc-${{ matrix.name }}
          path: dist/*
