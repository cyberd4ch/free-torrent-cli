name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p free-torrent-cli
      # Archives, never a bare binary: a raw download loses the executable bit, so
      # macOS and Linux hand the user a file that double-clicks into a text editor.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ftc.exe" stage/ftc.exe
            powershell -NoProfile -Command \
              "Compress-Archive -Path stage/ftc.exe -DestinationPath dist/ftc-${{ matrix.name }}.zip -Force"
          else
            cp "target/${{ matrix.target }}/release/ftc" stage/ftc
            chmod 755 stage/ftc
            tar -czf "dist/ftc-${{ matrix.name }}.tar.gz" -C stage ftc
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ftc-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ftc-*.tar.gz ftc-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ftc-*.tar.gz
            dist/ftc-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
