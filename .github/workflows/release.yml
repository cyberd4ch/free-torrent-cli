name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p free-torrent-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release/ftc
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          out="dist/ftc-${{ matrix.name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then out="$out.exe"; fi
          cp "$bin" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ftc-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x ftc-* || true
          sha256sum ftc-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ftc-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
